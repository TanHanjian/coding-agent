schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Product: 面向个人用户的本地优先 React Web 算法与面试题记忆 Agent。
  Delivery: MVP -> Phase 2 -> Phase 3。每条需求必须标明所属阶段。
  Platform constraints: React Web frontend, Go backend AI Agent orchestration, SQLite managed by Go, OpenAI-compatible model endpoints.
  Privacy constraints: ordinary records work offline; model requests occur only after explicit user action; secrets never enter the database, logs, or backups.

rules:
  proposal:
    - Keep the proposal concise and include a Non-goals subsection.
    - Identify the delivery phase for every major product capability.
  specs:
    - Prefix every requirement description with its delivery phase in square brackets, such as [MVP], [Phase 2], or [Phase 3].
    - Every requirement must define observable behavior, at least one failure or boundary scenario where relevant, and no implementation-specific library choices.
    - Use MUST as the normative keyword and WHEN/THEN for scenarios.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
